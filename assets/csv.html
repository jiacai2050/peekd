{{template "preview-header" .}}
        <div class="csv-list">
            <table>
                {{range $rowIndex, $row := .Rows}}
                <tr>
                    {{range $row}}
                    {{if eq $rowIndex 0}}<th>{{.}}</th>{{else}}<td>{{.}}</td>{{end}}
                    {{end}}
                </tr>
                {{else}}
                <tr><td>No rows found.</td></tr>
                {{end}}
            </table>
        </div>
{{template "preview-footer" .}}
