{{template "preview-header" .}}
        <div class="archive-list">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Perms</th>
                        <th>Size</th>
                        <th>Modified</th>
                    </tr>
                </thead>
                <tbody>
                    {{range .Entries}}
                    <tr{{if .IsDir}} class="archive-directory"{{end}}>
                        <td title="Compressed: {{.CompressedSize}}&#10;Ratio: {{.Ratio}}&#10;Method: {{.Method}}">{{.Name}}</td>
                        <td>{{.Permissions}}</td>
                        <td>{{.UncompressedSize}}</td>
                        <td>{{.Modified}}</td>
                    </tr>
                    {{else}}
                    <tr><td colspan="4">This archive is empty.</td></tr>
                    {{end}}
                </tbody>
            </table>
        </div>
{{template "preview-footer" .}}
