<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Preview - {{.FileName}}</title>
    <!-- This path corresponds to the embedded resource route configured in Go. -->
    <link rel="stylesheet" href="/__peekd_assets/preview.css">
</head>
<body>
    <div class="preview-container">
        <div class="file-header">
            <div class="file-heading">
                <div class="file-name">📄 {{.FileName}}</div>
                <div class="file-meta">
                    <span>{{.Size}}</span>
                    <span>Modified {{.Modified}}</span>
                </div>
            </div>
            <a class="download-button" href="{{.RawURL}}" download>Download original</a>
        </div>
        <pre class="code"><code>{{range .Lines}}<span class="code-line"><span class="line-content">{{.}}</span></span>{{end}}</code></pre>
        <footer class="site-footer">
            <div>
                <strong>Peekd</strong>
                <small>Fast web file server with rich previews.</small>
            </div>
            <div class="footer-meta">
                <small>{{.Version}}</small>
                <a href="{{.ProjectURL}}" target="_blank" rel="noreferrer">GitHub</a>
            </div>
        </footer>
    </div>
</body>
</html>
