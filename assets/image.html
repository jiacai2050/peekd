<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.FileName}} - Peekd</title>
    <link rel="stylesheet" href="/__peekd_assets/preview.css">
</head>
<body>
    <figure class="preview-container image-preview">
        <nav class="breadcrumbs" aria-label="Breadcrumb">
            {{range $index, $item := .Breadcrumbs}}{{if $index}}<span class="breadcrumb-separator">/</span>{{end}}{{if $item.Current}}<span aria-current="page">{{$item.Name}}</span>{{else}}<a href="{{$item.URL}}">{{$item.Name}}</a>{{end}}{{end}}
        </nav>
        <div class="file-header">
            <div class="file-heading">
                <div class="file-name">🖼️ {{.FileName}}</div>
                <div class="file-meta">
                    <span>{{.Size}}</span>
                    <span>Modified {{.Modified}}</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="download-button copy-button" type="button" data-copy-path="{{.LocalPath}}">Copy local path</button>
                <a class="download-button" href="./">Back to directory</a>
                <a class="download-button" href="{{.RawURL}}" download>Download original</a>
            </div>
        </div>
        <div class="image-frame">
            <img src="{{.RawURL}}" alt="{{.FileName}}">
        </div>
        <figcaption class="site-footer">
            <div>
                <strong>Peekd</strong>
                <small>Fast web file server with rich previews.</small>
            </div>
            <div class="footer-meta">
                <small>{{.Version}}</small>
                <a href="{{.ProjectURL}}" target="_blank" rel="noreferrer">GitHub</a>
            </div>
        </figcaption>
    </figure>
    <script src="/__peekd_assets/copy.js"></script>
</body>
</html>
