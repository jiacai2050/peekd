<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0F1B33"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="pupil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- dot grid texture -->
  <g fill="#ffffff" opacity="0.05">
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6"/>
    </pattern>
    <rect width="1280" height="640" fill="url(#dots)"/>
  </g>

  <!-- soft glow blob behind mark -->
  <circle cx="230" cy="300" r="260" fill="url(#glow)"/>

  <!-- logo mark -->
  <g transform="translate(110,220)">
    <rect x="0" y="0" width="160" height="160" rx="34" fill="url(#mark)"/>
    <path d="M40 58
             h27 l10 10 h45
             a6 6 0 0 1 6 6
             v36
             a6 6 0 0 1 -6 6
             h-82
             a6 6 0 0 1 -6 -6
             v-46
             a6 6 0 0 1 6 -6
             z"
          fill="#ffffff"/>
    <circle cx="115" cy="105" r="15" fill="none" stroke="#0B1220" stroke-width="7"/>
    <line x1="126" y1="116" x2="139" y2="129" stroke="#0B1220" stroke-width="7.5" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="300" y="280" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="76" font-weight="700" fill="#ffffff">peekd</text>
  <text x="302" y="320" font-family="Arial, sans-serif" font-size="22" fill="#93A5C4">Lightweight web file server for browsing</text>
  <text x="302" y="348" font-family="Arial, sans-serif" font-size="22" fill="#93A5C4">&amp; sharing local files</text>

  <!-- feature chips -->
  <g font-family="Arial, sans-serif" font-size="18" fill="#B9C6DE">
    <rect x="302" y="384" width="150" height="38" rx="19" fill="#ffffff" opacity="0.06"/>
    <text x="322" y="409">Single binary</text>

    <rect x="464" y="384" width="176" height="38" rx="19" fill="#ffffff" opacity="0.06"/>
    <text x="484" y="409">Rich previews</text>

    <rect x="652" y="384" width="150" height="38" rx="19" fill="#ffffff" opacity="0.06"/>
    <text x="672" y="409">Dark mode</text>
  </g>

  <!-- directory listing mockup card -->
  <g transform="translate(825,110)">
    <rect x="0" y="0" width="420" height="380" rx="16" fill="#101B32" stroke="#22314F" stroke-width="1.5"/>
    <!-- title bar -->
    <rect x="0" y="0" width="420" height="42" rx="16" fill="#152242"/>
    <rect x="0" y="26" width="420" height="16" fill="#152242"/>
    <circle cx="26" cy="21" r="6" fill="#EF4444"/>
    <circle cx="48" cy="21" r="6" fill="#F59E0B"/>
    <circle cx="70" cy="21" r="6" fill="#22C55E"/>
    <text x="140" y="27" font-family="Arial, sans-serif" font-size="14" fill="#7C8CAE">127.0.0.1:8090</text>

    <!-- listing rows -->
    <g font-family="Arial, sans-serif" font-size="16" fill="#D6DEEB">
      <rect x="20" y="66" width="380" height="40" rx="8" fill="url(#mark)" opacity="0.18"/>
      <circle cx="40" cy="86" r="7" fill="#22D3EE"/>
      <text x="60" y="91">README.md</text>

      <circle cx="40" cy="136" r="7" fill="#93A5C4"/>
      <text x="60" y="141">docs/</text>

      <circle cx="40" cy="176" r="7" fill="#93A5C4"/>
      <text x="60" y="181">internal/</text>

      <circle cx="40" cy="216" r="7" fill="#93A5C4"/>
      <text x="60" y="221">main.go</text>

      <circle cx="40" cy="256" r="7" fill="#93A5C4"/>
      <text x="60" y="261">install.sh</text>

      <circle cx="40" cy="296" r="7" fill="#93A5C4"/>
      <text x="60" y="301">go.mod</text>
    </g>

    <!-- zip download button hint -->
    <rect x="300" y="336" width="100" height="30" rx="8" fill="#ffffff" opacity="0.08"/>
    <text x="316" y="356" font-family="Arial, sans-serif" font-size="14" fill="#93A5C4">↓ ZIP</text>
  </g>
</svg>
